<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
  role="img"
  aria-label="Castmates"
>
  <defs>
    <linearGradient
      id="cm-lens"
      x1="23"
      y1="32"
      x2="41"
      y2="32"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="0.5" stop-color="#d946ef" />
      <stop offset="1" stop-color="#ef4444" />
    </linearGradient>
    <radialGradient
      id="cm-lens-glow"
      cx="32"
      cy="30"
      r="12"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left disc (indigo / royal blue). -->
  <circle cx="23" cy="32" r="18" fill="#6366f1" />

  <!-- Right disc (vivid crimson). -->
  <circle cx="41" cy="32" r="18" fill="#ef4444" />

  <!-- Intersection lens: indigo → magenta → crimson gradient. -->
  <path
    d="M32 16.412 A18 18 0 0 1 32 47.588 A18 18 0 0 1 32 16.412 Z"
    fill="url(#cm-lens)"
  />
  <path
    d="M32 16.412 A18 18 0 0 1 32 47.588 A18 18 0 0 1 32 16.412 Z"
    fill="url(#cm-lens-glow)"
  />

  <!-- Clapperboard, prominent in the lens. -->
  <g>
    <!-- Soft cast shadow under the slate. -->
    <rect
      x="21.5"
      y="31.8"
      width="21"
      height="13"
      rx="1.6"
      fill="#0a0114"
      opacity="0.22"
    />

    <!-- Hinged top: tilted bar with diagonal stripes. -->
    <g transform="rotate(-10 32 26)">
      <rect x="21.5" y="22.5" width="21" height="6" rx="1.1" fill="#ffffff" />
      <path d="M23.5 28.5 L26.8 22.5 L28.8 22.5 L25.5 28.5 Z" fill="#0a0114" />
      <path d="M29 28.5 L32.3 22.5 L34.3 22.5 L31 28.5 Z" fill="#0a0114" />
      <path d="M34.5 28.5 L37.8 22.5 L39.8 22.5 L36.5 28.5 Z" fill="#0a0114" />
    </g>

    <!-- Slate body. -->
    <rect x="21.5" y="31" width="21" height="13" rx="1.6" fill="#ffffff" />
    <line
      x1="24.5"
      y1="35.6"
      x2="39.5"
      y2="35.6"
      stroke="#0a0114"
      stroke-width="0.7"
      stroke-linecap="round"
      opacity="0.22"
    />
    <line
      x1="24.5"
      y1="39.4"
      x2="39.5"
      y2="39.4"
      stroke="#0a0114"
      stroke-width="0.7"
      stroke-linecap="round"
      opacity="0.22"
    />
  </g>
</svg>
